name: Token Editor Deployment Workflow

# The token editor (the frontend's tokens mode: pnpm run buildci_tokens) is a page on its
# own, served at /client/tokens/. It runs in the browser only and talks to no server, so
# it doesn't follow the protocol versions and is deployed apart from the player client.

on:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: 'Frontend branch, tag or commit to build'
        required: true
        default: 'development'
        type: string

jobs:
  build_token_editor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NordvikManager FrontEnd repository
        uses: actions/checkout@v4
        with:
          repository: haffff/NordvikManagerFrontend
          ref: ${{ github.event.inputs.frontend_ref }}
          path: frontend
      - name: Checkout NordvikManager Configuration
        uses: actions/checkout@v4
        with:
          path: config
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.7.0'
      - name: get env file
        run: |
          mv config/releaseconfig/all_in_one/client/.env frontend/.env
      - name: Build token editor
        run: |
          cd frontend
          pnpm install
          pnpm run buildci_tokens
          cd ..
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tokens-build
          path: frontend/dist
  deploy_token_editor:
    runs-on: ubuntu-latest
    needs: [build_token_editor]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: tokens-build
          path: tokens
      # Its own folder and sync state: the player client's uploads to /client/ never touch it,
      # and this one only deletes files it uploaded itself.
      - name: Deploy token editor to FTP (/client/tokens/)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FRONT_FTP_SERVER }}
          username: ${{ secrets.FRONT_FTP_USERNAME }}
          password: ${{ secrets.FRONT_FTP_PASSWORD }}
          local-dir: ./tokens/
          server-dir: /client/tokens/
          state-name: .ftp-deploy-client-tokens.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
