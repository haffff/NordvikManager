name: Player Frontend Deployment Workflow

on:
  workflow_dispatch:
    inputs:
      # release: the main branch to /client/, /client/p<N>/ and the demo at /client/demo/.
      # dev: the development branch to /client/dev/ only, leaving the live client alone.
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - dev
    
  # push:
  #   branches:
  #     - main

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    outputs:
      protocol: ${{ steps.protocol.outputs.protocol }}
    steps:      
      - name: Checkout NordvikManager FrontEnd repository
        uses: actions/checkout@v4
        with:
          repository: haffff/NordvikManagerFrontend
          ref: ${{ github.event.inputs.build_type == 'dev' && 'development' || 'main' }}
          path: frontend
      - name: Checkout NordvikManager Configuration
        uses: actions/checkout@v4
        with:
          path: config
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.7.0'
      - name: get env file
        run: |
          mv config/releaseconfig/all_in_one/client/.env frontend/.env
      - name: Read protocol version
        id: protocol
        run: |
          PROTOCOL=$(jq -er '.protocol' frontend/src/protocol.json)
          if ! [[ "$PROTOCOL" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::frontend/src/protocol.json has an invalid protocol: $PROTOCOL"
            exit 1
          fi
          echo "protocol=$PROTOCOL" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: |
          cd frontend
          pnpm install
          pnpm run buildci_player
          mv dist dist-player
          cd ..
      # The public demo: the same app on recorded data, no server (served at /client/demo/).
      - name: Build demo
        if: github.event.inputs.build_type != 'dev'
        run: |
          cd frontend
          pnpm run buildci_demo
          mv dist dist-demo
          cd ..
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: front-build
          path: frontend/dist-player
      - name: Upload demo artifacts
        if: github.event.inputs.build_type != 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: demo-build
          path: frontend/dist-demo
  deploy_frontend:
      runs-on: ubuntu-latest
      needs: [build_frontend]
      steps:      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: front-build
          path: player
      - name: Download demo artifacts
        if: github.event.inputs.build_type != 'dev'
        uses: actions/download-artifact@v4
        with:
          name: demo-build
          path: demo
      # The same build is uploaded twice: as the latest client at /client/ and as the
      # frozen client for its protocol at /client/p<N>/ (players are switched there when
      # the GM's backend speaks protocol N). Two separate uploads with their own sync
      # state: one combined upload would delete older p<N> folders it no longer sees.
      # The /client/ upload never touches p<N>/ — the action only deletes files it uploaded itself.
      - name: Deploy latest client to FTP (/client/)
        if: github.event.inputs.build_type != 'dev'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FRONT_FTP_SERVER }}
          username: ${{ secrets.FRONT_FTP_USERNAME }}
          password: ${{ secrets.FRONT_FTP_PASSWORD }}
          local-dir: ./player/
          server-dir: /client/
          state-name: .ftp-deploy-client-latest.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
      # Only release builds become a protocol's frozen client: a dev build may speak a protocol
      # no released backend has yet.
      - name: Deploy protocol client to FTP (/client/p${{ needs.build_frontend.outputs.protocol }}/)
        if: github.event.inputs.build_type != 'dev'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FRONT_FTP_SERVER }}
          username: ${{ secrets.FRONT_FTP_USERNAME }}
          password: ${{ secrets.FRONT_FTP_PASSWORD }}
          local-dir: ./player/
          server-dir: /client/p${{ needs.build_frontend.outputs.protocol }}/
          state-name: .ftp-deploy-client-protocol.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
      # The demo has its own folder and sync state; the /client/ upload above never touches it.
      - name: Deploy demo to FTP (/client/demo/)
        if: github.event.inputs.build_type != 'dev'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FRONT_FTP_SERVER }}
          username: ${{ secrets.FRONT_FTP_USERNAME }}
          password: ${{ secrets.FRONT_FTP_PASSWORD }}
          local-dir: ./demo/
          server-dir: /client/demo/
          state-name: .ftp-deploy-client-demo.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
      # Dev builds get their own folder and sync state. A GM backend on another protocol still
      # switches players to the frozen /client/p<N>/ build, as from /client/.
      - name: Deploy dev client to FTP (/client/dev/)
        if: github.event.inputs.build_type == 'dev'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FRONT_FTP_SERVER }}
          username: ${{ secrets.FRONT_FTP_USERNAME }}
          password: ${{ secrets.FRONT_FTP_PASSWORD }}
          local-dir: ./player/
          server-dir: /client/dev/
          state-name: .ftp-deploy-client-dev.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
